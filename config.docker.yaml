server:
  host: "0.0.0.0"
  port: 8080
refresh:
  interval_seconds: 7200
daily_plan:
  enabled: true
  time: "07:30"
openai:
  enabled: false
  # Set the API key through the OPENAI_API_KEY environment variable.
  base_url: "http://host.docker.internal:11434/v1"
  model: "qwen3:4b"
  timeout_seconds: 60
mail:
  limit: 20
notes:
  folder: "Notes"
storage:
  file: "/app/data/state.json"
  audit_file: "/app/data/refresh_log.jsonl"
scripts:
  timeout_seconds: 3
  calendar: "./scripts/calendar_export.scpt"
  reminders: "./scripts/reminders_export.scpt"
  mail: "./scripts/mail_inbox.scpt"
  notes: "./scripts/notes_export.scpt"
