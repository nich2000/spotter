<style>
#scal{--bg:light-dark(#f5f6f8,#191c22);--paper:light-dark(#fff,#242830);--ink:light-dark(#202936,#e9eef6);--muted:light-dark(#687384,#a9b4c4);--line:light-dark(#e1e6ee,#39424f);--blue:light-dark(#315fbd,#a8c6ff);--soft:light-dark(#e6eeff,#303f59);--purple:light-dark(#725299,#d5b9f4);--lav:light-dark(#f1eafa,#44344e);font:14px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg);padding:22px;border-radius:16px}#scal *{box-sizing:border-box}#scal header{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:0 75px 18px 0;border-bottom:1px solid var(--line)}#scal nav{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted)}#scal nav strong{color:var(--blue)}#scal h2{font-size:23px;margin:0;font-weight:600}#scal h3{font-size:16px;margin:0;font-weight:600}#scal small,#scal .muted{font-size:12px;color:var(--muted)}#scal .tools,#scal .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#scal .tools{justify-content:space-between;margin:20px 0 15px}#scal button,#scal select,#scal input{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:7px 10px;max-width:100%}#scal .primary{background:var(--blue);color:light-dark(#fff,#182333);border-color:transparent}#scal .month{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}#scal .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;color:var(--muted);font-size:12px;padding:10px 0}#scal .week{position:relative;border-top:1px solid var(--line)}#scal .dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}#scal .date{height:105px;border:0;border-right:1px solid var(--line);border-radius:0;text-align:left;vertical-align:top;padding:8px;background:transparent;display:flex;flex-direction:column;justify-content:space-between;min-width:0}#scal .date:nth-child(n+6){background:color-mix(in srgb,var(--bg) 60%,transparent)}#scal .date.selected{background:var(--soft);box-shadow:inset 0 0 0 2px var(--blue)}#scal .date.off{color:var(--muted)}#scal .date span{display:block}#scal .date .num{align-self:flex-start;padding:1px 6px}#scal .date.today .num{border-radius:15px;background:var(--blue);color:light-dark(#fff,#182333)}#scal .daynotes{font-size:11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}#scal .ribbons{position:absolute;top:37px;left:0;right:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px 0;pointer-events:none}#scal .ribbon{pointer-events:auto;background:var(--soft);color:var(--blue);margin:0 3px;border:0;border-radius:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:3px 7px;height:23px}#scal .ribbon.second{background:var(--lav);color:var(--purple)}#scal .legend{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0;color:var(--muted);font-size:12px}#scal .lower{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;margin-top:22px}#scal .detail,#scal .assign{min-width:0}#scal .interval{background:var(--soft);color:var(--blue);padding:9px 12px;border-radius:7px;margin:10px 0;font-size:12px}#scal .assign{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;align-self:start}#scal label{display:block;font-size:12px;color:var(--muted);margin:12px 0}#scal label select,#scal label input{display:block;width:100%;margin-top:5px}#scal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}#scal .preview{padding:12px;background:var(--soft);border-radius:7px;margin:12px 0}#scal #sc-message{margin-top:12px;font-size:12px}#scal [hidden]{display:none}#scal .listitem{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}#scal .listitem button{font-size:11px;padding:3px 6px;margin-left:5px}@media(max-width:640px){#scal{padding:12px}#scal header{padding-right:0}#scal .lower{grid-template-columns:1fr}#scal .date{padding:5px 1px;height:99px}#scal .daynotes{font-size:11px}#scal .ribbon{font-size:11px;padding:3px}#scal nav{gap:9px}}@media(pointer:coarse){#scal button{min-height:44px}#scal .ribbon{min-height:23px}}
</style>
<div id="scal">
<header><strong>spotter</strong><nav aria-label="Разделы"><span>Сейчас</span><span>Inbox</span><strong>Календарь</strong><span>Планирование</span><span>Проекты</span><span>Статистика</span><span>Моё состояние</span></nav></header>
<div class="tools"><div><h2>Календарь</h2><small>Демонстрационные данные · Москва</small></div><div class="flex"><button id="sc-prev" class="cursor-interaction" aria-label="Предыдущий месяц">←</button><h3 id="sc-month"></h3><button id="sc-next" class="cursor-interaction" aria-label="Следующий месяц">→</button><button id="sc-today" class="cursor-interaction">Сегодня</button></div></div>
<div class="month"><div class="dow"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div id="sc-grid"></div></div>
<div class="legend"><span>━ Интервал задачи: не занятость</span><span>● Рабочие блоки</span><span>▣ Внешние встречи · просмотр</span><span>◆ Дедлайн</span></div>
<div class="lower"><section class="detail"><h3 id="sc-day"></h3><div id="sc-intervals"></div><div id="sc-schedule"></div><div id="sc-event-list"></div></section><section class="assign"><h3>Назначить рабочий блок</h3><small id="sc-target"></small><label>Задача<select id="sc-task"><option value="export">Добавить кнопку экспорта · Секира</option><option value="sync">Проверить синхронизацию · Секира</option><option value="budget">Составить бюджет · Личное</option></select></label><div class="two"><label>Начало<input id="sc-time" type="time" value="11:00"></label><label>Работа, минут<select id="sc-duration"><option>25</option><option>50</option><option>75</option></select></label></div><small>25 минут работы / 5 минут перерыв между блоками</small><div style="margin-top:14px"><button id="sc-propose" class="primary cursor-interaction">Предложить размещение</button></div><div id="sc-preview" class="preview" hidden><div id="sc-preview-text"></div><div class="flex" style="margin-top:10px"><button id="sc-confirm" class="primary cursor-interaction">Подтвердить</button><button id="sc-cancel" class="cursor-interaction">Отмена</button></div></div><div id="sc-message" role="status" aria-live="polite"></div></section></div>
</div>
<script>
(()=>{const root=document.getElementById('scal'),q=s=>root.querySelector(s),D=86400000;let year=2026,month=9,selected='2026-10-05',pending=null;const tasks={export:{title:'Добавить кнопку экспорта',start:'2026-10-05',end:'2026-10-09',deadline:'2026-10-09'},sync:{title:'Проверить синхронизацию',start:'2026-10-08',end:'2026-10-14',deadline:'2026-10-15'},budget:{title:'Составить бюджет',start:'2026-10-16',end:'2026-10-16',deadline:'2026-10-16'}};let events=[{id:'a',date:'2026-10-05',title:'Командная встреча',start:'10:00',end:'10:30',external:true},{id:'b',date:'2026-10-05',title:tasks.export.title,start:'09:00',end:'09:25',task:'export'},{id:'c',date:'2026-10-05',title:tasks.export.title,start:'09:30',end:'09:55',task:'export'},{id:'d',date:'2026-10-08',title:'Обсуждение API',start:'14:00',end:'15:00',external:true},{id:'e',date:'2026-10-12',title:tasks.sync.title,start:'11:00',end:'11:25',task:'sync'},{id:'f',date:'2026-10-16',title:tasks.budget.title,start:'10:00',end:'10:25',task:'budget'}];
const iso=d=>d.toISOString().slice(0,10),date=s=>new Date(s+'T00:00:00Z'),fmt=s=>date(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',timeZone:'UTC'}),mins=s=>{const [h,m]=s.split(':').map(Number);return h*60+m;},time=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cal=document.createElement('viz-calendar');cal.setAttribute('start','09:00');cal.setAttribute('end','18:00');cal.setAttribute('lang','ru');cal.setAttribute('time-zone','Москва');cal.setAttribute('empty-label','На этот день блоки не назначены');q('#sc-schedule').append(cal);
function save(){window.openai?.setWidgetState?.({modelContent:{mockup:'Календарь Spotter',selected,events},privateContent:{year,month}})?.catch(()=>{});}
function restore(s){if(s?.modelContent?.mockup!=='Календарь Spotter')return;let a=s.modelContent;if(/^\d{4}-\d{2}-\d{2}$/.test(a.selected)&&!isNaN(date(a.selected)))selected=a.selected;if(Array.isArray(a.events)&&a.events.length<100&&a.events.every(e=>typeof e.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&/^\d{2}:\d{2}$/.test(e.start)&&/^\d{2}:\d{2}$/.test(e.end)))events=a.events;if(Number.isInteger(s.privateContent?.year)&&s.privateContent.year>=2000&&s.privateContent.year<=2100)year=s.privateContent.year;if(Number.isInteger(s.privateContent?.month)&&s.privateContent.month>=0&&s.privateContent.month<12)month=s.privateContent.month;}
function render(){q('#sc-month').textContent=new Date(Date.UTC(year,month,1)).toLocaleDateString('ru-RU',{month:'long',year:'numeric',timeZone:'UTC'});const first=new Date(Date.UTC(year,month,1)),shift=(first.getUTCDay()+6)%7,start=first.getTime()-shift*D,count=Math.ceil((shift+new Date(Date.UTC(year,month+1,0)).getUTCDate())/7);let html='';for(let w=0;w<count;w++){let ws=start+w*7*D;html+='<div class="week"><div class="dates">';for(let i=0;i<7;i++){const d=new Date(ws+i*D),s=iso(d),ev=events.filter(e=>e.date===s),deadline=Object.values(tasks).some(t=>t.deadline===s);html+=`<button class="date cursor-interaction ${s===selected?'selected':''} ${s==='2026-10-05'?'today':''} ${d.getUTCMonth()!==month?'off':''}" data-date="${s}" aria-pressed="${s===selected}" aria-label="${fmt(s)}, ${ev.length} событий${deadline?', дедлайн':''}"><span class="num">${d.getUTCDate()}</span><span class="daynotes">${deadline?'◆ ':''}${ev.length?'● '+ev.length+' · '+ev[0].start:''}</span></button>`;}html+='</div><div class="ribbons">';Object.entries(tasks).forEach(([id,t],n)=>{let l=Math.max(date(t.start).getTime(),ws),r=Math.min(date(t.end).getTime(),ws+6*D);if(l<=r)html+=`<button class="ribbon cursor-interaction ${id==='sync'?'second':''}" data-task="${id}" data-date="${iso(new Date(l))}" style="grid-column:${(l-ws)/D+1} / ${(r-ws)/D+2};grid-row:${id==='sync'?2:1}" data-tooltip="${esc(t.title)} · ${fmt(t.start)} — ${fmt(t.end)}">${esc(t.title)}</button>`;});html+='</div></div>';}q('#sc-grid').innerHTML=html;renderDay();}
function renderDay(){q('#sc-day').textContent=date(selected).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});q('#sc-target').textContent=fmt(selected);q('#sc-intervals').innerHTML=Object.values(tasks).filter(t=>selected>=t.start&&selected<=t.end).map(t=>`<div class="interval">${esc(t.title)} · до ${fmt(t.end)}</div>`).join('');const ev=events.filter(e=>e.date===selected).sort((a,b)=>a.start.localeCompare(b.start));cal.setAttribute('date',selected);cal.events=ev.map(e=>({...e,tone:e.external?'purple':'blue',detail:e.external?'Внешний календарь · только просмотр':'Рабочий блок · '+(mins(e.end)-mins(e.start))+' мин'}));q('#sc-event-list').innerHTML=ev.map(e=>`<div class="listitem">${e.start}–${e.end} · ${esc(e.title)} ${e.external?'<span class="muted">▣ Только просмотр</span>':`<button class="cursor-interaction" data-remove="${esc(e.id)}" aria-label="Убрать блок ${esc(e.title)} в ${e.start}">Убрать блок</button>`}</div>`).join('');}
function clear(){pending=null;q('#sc-preview').hidden=true;q('#sc-message').textContent='';}root.addEventListener('click',e=>{let b=e.target.closest('[data-date]');if(b){selected=b.dataset.date;if(b.dataset.task)q('#sc-task').value=b.dataset.task;clear();render();save();}let del=e.target.closest('[data-remove]');if(del){events=events.filter(ev=>ev.id!==del.dataset.remove||ev.external);clear();render();save();}});
function move(n){let d=new Date(Date.UTC(year,month+n,1));year=d.getUTCFullYear();month=d.getUTCMonth();clear();render();save();}q('#sc-prev').onclick=()=>move(-1);q('#sc-next').onclick=()=>move(1);q('#sc-today').onclick=()=>{year=2026;month=9;selected='2026-10-05';clear();render();save();};['#sc-task','#sc-time','#sc-duration'].forEach(s=>q(s).onchange=clear);
q('#sc-propose').onclick=()=>{clear();const task=q('#sc-task').value,t=tasks[task],v=q('#sc-time').value;if(!v){q('#sc-message').textContent='Укажите время начала.';return;}if(selected<t.start||selected>t.end){q('#sc-message').textContent='Дата вне интервала задачи: '+fmt(t.start)+' — '+fmt(t.end)+'. Выберите день внутри интервала.';return;}const n=+q('#sc-duration').value/25,a=mins(v),end=a+n*25+(n-1)*5;if(a<540||end>1080){q('#sc-message').textContent='Блоки должны поместиться в рабочее время 09:00–18:00.';return;}const occupied=events.filter(e=>e.date===selected);if(occupied.some(e=>a<mins(e.end)&&end>mins(e.start))){q('#sc-message').textContent='Это время уже занято. Выберите другое начало.';return;}pending=Array.from({length:n},(_,i)=>({id:'user-'+Date.now()+'-'+i,date:selected,title:t.title,task,start:time(a+i*30),end:time(a+i*30+25)}));q('#sc-preview-text').textContent=fmt(selected)+' · '+time(a)+'–'+time(end)+' · '+n+' × 25 мин'+(n>1?' + перерывы по 5 мин':'');q('#sc-preview').hidden=false;};q('#sc-confirm').onclick=()=>{if(!pending)return;events.push(...pending);clear();render();q('#sc-message').textContent='Рабочие блоки добавлены в макет. Фокус и таймер не запущены.';save();};q('#sc-cancel').onclick=clear;restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);clear();render();}});
})();
</script>
