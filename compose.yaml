name: spotter
x-app: &app
  build: .
  image: spotter:local
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgres://spotter:${POSTGRES_PASSWORD:?Run scripts/setup_local.sh}@postgres:5432/spotter
    NATS_URL: nats://spotter:${NATS_PASSWORD:?Run scripts/setup_local.sh}@nats:4222
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Run scripts/setup_local.sh}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/setup_local.sh}
    SPOTTER_ORIGIN: http://localhost:18080
  networks: [backend]
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotter
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.sh}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U spotter -d spotter']
      interval: 3s
      timeout: 3s
      retries: 30
  nats:
    image: nats:2.11.8-alpine
    restart: unless-stopped
    command: ['-js', '-sd', '/data', '--user', 'spotter', '--pass', '${NATS_PASSWORD:?Run scripts/setup_local.sh}']
    volumes: [nats:/data]
    networks: [backend]
  minio:
    image: spotter-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: .
      dockerfile: deploy/minio.Dockerfile
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/setup_local.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/setup_local.sh}
    volumes: [minio:/data]
    networks: [backend]
  migrate:
    <<: *app
    restart: 'no'
    command: ['-role', 'migrate']
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: ['-role', 'api']
    ports: ['127.0.0.1:18080:8080']
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
      minio: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, '--header=Host: localhost:18080', 'http://127.0.0.1:8080/readyz']
      interval: 10s
      timeout: 3s
      retries: 12
  worker:
    <<: *app
    command: ['-role', 'worker']
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
volumes:
  postgres:
  nats:
  minio:
networks:
  backend:
  # Test services are defined in compose.test.yaml to keep the normal runtime small.
